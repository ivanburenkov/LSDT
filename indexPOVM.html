<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector Tomography: Least Squares with Custom WASM Initial POVM</title>
    
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1500px; margin: 0 auto; padding: 20px; color: #333; background-color: #f4f7f6; }
        h1 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; color: #0056b3; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        
        .sidebar { flex: 1; min-width: 340px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .main-content { flex: 2; min-width: 700px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input[type="number"], input[type="file"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background-color: #fff; }
        
        .custom-param-box { background: #eef3f9; padding: 12px; border-radius: 6px; border: 1px dashed #0056b3; margin-top: 10px; display: none; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button { border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-size: 15px; width: 100%; font-weight: bold; }
        #btn-init { background: #6c757d; color: white; }
        #btn-run { background: #28a745; color: white; }
        #btn-stop { background: #dc3545; color: white; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        
        .log-area { width: 100%; height: 180px; background: #1e1e1e; color: #00ff00; padding: 10px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #333; }
        .plot-container { width: 100%; max-width: 900px; min-height: 400px; margin: 0 auto; background: #fafafa; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h1>Detector Tomography: Least Squares with Custom WASM Initial POVM</h1>

    <div class="container">
        <div class="sidebar">
            <h3>Configuration</h3>
            
            <div class="form-group">
                <label>Experimental Data File (.txt / .dat)</label>
                <input type="file" id="data-file" accept=".txt,.dat">
            </div>

            <div class="form-group">
                <label>Max input photons (N)</label>
                <input type="number" id="max-n" value="20">
            </div>

            <div class="form-group">
                <label>Initial POVM Guess Strategy</label>
                <select id="povm-init-strategy" onchange="toggleStrategyParams()">
                    <option value="uniform">1. Uniform (Default)</option>
                    <option value="random">2. Random (Normalized Rows)</option>
                    <option value="ideal">3. Idealized PNR Detector (WASM)</option>
                    <option value="qpnr">4. QPNR Detector (WASM)</option>
                </select>
            </div>

            <div id="strategy-params" class="custom-param-box">
                <div class="form-group">
                    <label>Detection Efficiency (η)</label>
                    <input type="number" id="param-eta" value="0.75" step="0.05" min="0" max="1">
                </div>
                <div class="form-group">
                    <label>Dark Count Rate (ν)</label>
                    <input type="number" id="param-dark" value="0.002" step="0.001" min="0" max="1">
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-init">1. Initialize Environment</button>
                <button id="btn-run" disabled>2. Start Calculation</button>
                <button id="btn-stop" disabled>Stop / Reset</button>
            </div>
            
            <div id="log-output" class="log-area">Status: Waiting for initialization...</div>
        </div>

         <div class="main-content">
            <div id="plot-fit" class="plot-container"></div>
            <div id="plot-heat" class="plot-container"></div>
        </div>
    </div>

    <script id="worker-code" type="javascript/worker">
        importScripts("https://cdn.jsdelivr.net/pyodide/v0.28.0/full/pyodide.js");
        // simulator.js will be injected dynamically into the worker context
        let pyodide;
        let wasmModule;

        const pythonMLE = `
import numpy as np
import cvxpy as cp
import math

def f_experiment(mean_photon_numbers, k):
    F = np.zeros((len(mean_photon_numbers), k + 1))
    for j1, mu in enumerate(mean_photon_numbers):
        for j2 in range(k + 1):
            F[j1, j2] = np.exp(-mu) * (mu**j2) / math.factorial(j2)
    F[:, -1] = 1.0 - np.sum(F[:, :-1], axis=1)
    return np.clip(F, 1e-15, 1.0)

def run_continuous_mle(P_list, alpha_list, n_outcomes, k_plus_1, n_pulses, strategy, initial_guess_flat, js_post_message):
    P_meas = np.array(P_list).reshape((-1, n_outcomes))
    k = k_plus_1 - 1
    F = f_experiment(np.array(alpha_list), k)
    
    # Restructure initial guess matrix fed directly out of target JS/WASM configuration layer
    Pi_initial_guess = np.array(initial_guess_flat).reshape((k_plus_1, n_outcomes))
    
    piOpt = cp.Variable((k + 1, n_outcomes))
    constraints = [piOpt >= 0, cp.sum(piOpt, axis=1) == 1]
    
    maxLLObj = cp.Minimize(cp.sum((P_meas - n_pulses * F @ piOpt)**2 / (P_meas + 0.5)))
    maxLLProb = cp.Problem(maxLLObj, constraints)
    
    try:
        logLikelihood = maxLLProb.solve(solver=cp.CLARABEL, verbose=False)
    except Exception:
        logLikelihood = maxLLProb.solve(verbose=False)
    
    Pi_res = piOpt.value
    if Pi_res is None:
        Pi_res = Pi_initial_guess
        
    expected = (F @ Pi_res) * n_pulses
    chiSq = np.sum((P_meas - expected)**2 / (P_meas + 0.1))
    
    js_post_message(Pi_res.flatten(order='F').tolist(), expected.flatten().tolist(), float(chiSq))
    return True
`;

        self.onmessage = async function(e) {
            const data = e.data;
            if (data.type === 'init') {
                self.postMessage({type: 'log', msg: 'Loading simulation scripts and Pyodide core...'});
                
                // Inject the simulator codebase provided by the context
                eval(data.simulatorJsCode);
                
                wasmModule = await createSimulator();
                self.postMessage({type: 'log', msg: 'WASM Simulator Module established.'});

                pyodide = await loadPyodide();
                await pyodide.loadPackage(['numpy', 'scipy', 'cvxpy-base']);
                await pyodide.runPythonAsync(pythonMLE);
                self.postMessage({type: 'ready'});
            } 
            else if (data.type === 'run') {
                self.postMessage({type: 'log', msg: `Generating initial matrix using method: [${data.strategy}]...`});
                
                let k_plus_1 = data.maxN + 1;
                let n_outcomes = data.maxC + 1;
                let flatGuess = new Array(k_plus_1 * n_outcomes).fill(0);

                if (data.strategy === 'uniform') {
                    flatGuess = flatGuess.map(() => 1 / n_outcomes);
                } else if (data.strategy === 'random') {
                    for(let i=0; i<k_plus_1; i++) {
                        let sum = 0;
                        let rRow = Array.from({length: n_outcomes}, () => { let r = Math.random(); sum+=r; return r; });
                        for(let j=0; j<n_outcomes; j++) flatGuess[i * n_outcomes + j] = rRow[j] / sum;
                    }
                } else {
                    // Strategy 3 (Ideal PNR) or 4 (QPNR) directly calling WASM bindings via heap pointers
                    let typeId = (data.strategy === 'ideal') ? 0 : 1; 
                    let size = k_plus_1 * n_outcomes * 8; // Double resolution allocations
                    let ptr = wasmModule._malloc(size);
                    
                    // Call the compiled C interface function directly
                    wasmModule._generate_povm(typeId, data.maxC, data.maxN, data.eta, data.dark, ptr);
                    
                    let view = new Float64Array(wasmModule.HEAPF64.buffer, ptr, k_plus_1 * n_outcomes);
                    // Copy results over out of the isolated module heap context
                    for(let i=0; i<view.length; i++) flatGuess[i] = view[i];
                    wasmModule._free(ptr);
                }

                self.postMessage({type: 'log', msg: 'Initial guess setup. Initializing optimization loop...'});
                
                const js_callback = (xk, expected, mse) => {
                    self.postMessage({ type: 'progress', xk: xk.toJs(), expected: expected.toJs(), mse: mse });
                };
                
                pyodide.globals.get("run_continuous_mle")(
                    data.counts, data.alphas, n_outcomes, k_plus_1, data.npulses, 
                    data.strategy, flatGuess, js_callback
                );
                self.postMessage({type: 'done'});
            }
        };
    </script>

    <script>
        let parsedAlphas, parsedCounts, currentMaxC = 0, extractedNpulses = 1;
        let worker;
        let simulatorJsCode = "";

        const logMsg = (m) => {
            const e = document.getElementById('log-output');
            e.innerText += `\n[${new Date().toLocaleTimeString()}] ${m}`;
            e.scrollTop = e.scrollHeight;
        };

        function toggleStrategyParams() {
            const val = document.getElementById('povm-init-strategy').value;
            const box = document.getElementById('strategy-params');
            box.style.display = (val === 'ideal' || val === 'qpnr') ? 'block' : 'none';
        }

        // Fetch local dependency file or load via input string allocation pipelines
        async function loadSimulatorSource() {
            try {
                const res = await fetch('simulator.js');
                simulatorJsCode = await res.text();
                logMsg("Successfully cached local `simulator.js` execution library source.");
            } catch(e) {
                logMsg("Warning: Could not fetch simulator.js automatically. Ensure it sits in the same directory path.");
            }
        }

        function createWorker() {
            const blob = new Blob([document.getElementById('worker-code').textContent], {type: 'application/javascript'});
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                const msg = e.data;
                if (msg.type === 'log') logMsg(msg.msg);
                else if (msg.type === 'ready') {
                    logMsg("WASM & Python threads running smoothly. Load experimental files.");
                    document.getElementById('btn-init').disabled = true;
                    if(parsedCounts) document.getElementById('btn-run').disabled = false;
                } 
                else if (msg.type === 'progress') updateUI(msg.xk, msg.expected, msg.mse);
                else if (msg.type === 'done') {
                    logMsg("CVXPY matrix solve sequence completed successfully.");
                    document.getElementById('btn-run').disabled = false;
                    document.getElementById('btn-stop').disabled = true;
                }
            };
        }

        window.onload = () => {
            loadSimulatorSource();
            createWorker();
        };

        document.getElementById('btn-init').onclick = () => {
            if(!simulatorJsCode) {
                logMsg("Error: Cannot initialize worker until simulator.js source code text is verified and loaded.");
                return;
            }
            document.getElementById('btn-init').disabled = true;
            worker.postMessage({ type: 'init', simulatorJsCode: simulatorJsCode });
        };

        document.getElementById('data-file').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tokens = ev.target.result.trim().split(/\s+/).filter(Boolean).map(Number);
                let idx = 0;
                currentMaxC = tokens[idx++];
                const numA = tokens[idx++];
                parsedAlphas = [];
                for(let i=0; i<numA; i++) parsedAlphas.push(tokens[idx++]);
                parsedCounts = [];
                for(let i=0; i<numA*(currentMaxC+1); i++) parsedCounts.push(tokens[idx++]);
                
                let firstAlphaSum = 0;
                for(let c=0; c <= currentMaxC; c++) firstAlphaSum += parsedCounts[c];
                extractedNpulses = firstAlphaSum;
                
                logMsg(`Data loaded: ${numA} attenuations. Npulses ≈ ${extractedNpulses}`);
                initPlots(currentMaxC, numA);
                if(document.getElementById('btn-init').disabled) document.getElementById('btn-run').disabled = false;
            };
            reader.readAsText(e.target.files[0]);
        };

        function initPlots(maxC, numA) {
            const traces = [];
            for(let c=0; c<=maxC; c++) {
                const y = [];
                for(let i=0; i<numA; i++) y.push(parsedCounts[i*(maxC+1)+c]);
                traces.push({ x: parsedAlphas, y: y, mode: 'markers', name: `Exp c=${c}` });
                traces.push({ x: parsedAlphas, y: new Array(numA).fill(0), mode: 'lines', name: `Fit c=${c}`, line: {dash:'dot'} });
            }
            Plotly.newPlot('plot-fit', traces, { title: 'Experimental Counts vs Calculated Optimization Fit', margin: {t:40}, xaxis: {title:'Alpha'}, yaxis: {title:'Counts'} });
            Plotly.newPlot('plot-heat', [{ z: [[]], type: 'heatmap', colorscale: 'Viridis' }], { title: 'POVM Reconstruction Matrix Result (Final State)', margin: {t:40} });
        }

        function updateUI(flatX, fitFlat, mse) {
            const maxN = parseInt(document.getElementById('max-n').value);
            const n_outcomes = currentMaxC + 1;
            const k_plus_1 = maxN + 1;

            const z = [];
            for(let c=0; c < n_outcomes; c++) {
                let row = [];
                for(let n=0; n < k_plus_1; n++) row.push(flatX[c * k_plus_1 + n]);
                z.push(row);
            }
            Plotly.restyle('plot-heat', { z: [z] });

            const fitY = [], fitIdx = [];
            for(let c=0; c < n_outcomes; c++) {
                const row = [];
                for(let a=0; a < parsedAlphas.length; a++) row.push(fitFlat[a * n_outcomes + c]);
                fitY.push(row); fitIdx.push((c*2)+1);
            }
            Plotly.restyle('plot-fit', { y: fitY }, fitIdx);
            logMsg(`Solve Finalized | Chi-Sq Fit Metric: ${mse.toExponential(4)}`);
        }

        document.getElementById('btn-stop').onclick = () => {
            worker.terminate();
            logMsg("Worker Terminated. Engine execution thread reset.");
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-init').disabled = false;
            createWorker();
        };

        document.getElementById('btn-run').onclick = () => {
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            
            worker.postMessage({
                type: 'run',
                counts: Array.from(parsedCounts),
                alphas: Array.from(parsedAlphas),
                maxC: currentMaxC,
                maxN: parseInt(document.getElementById('max-n').value),
                npulses: extractedNpulses,
                strategy: document.getElementById('povm-init-strategy').value,
                eta: parseFloat(document.getElementById('param-eta').value),
                dark: parseFloat(document.getElementById('param-dark').value)
            });
        };
    </script>
</body>
</html>
